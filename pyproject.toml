[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshitrader"
version = "0.1.0"
description = "Cold, low-risk quantitative trading agent for Kalshi prediction markets with tracking and a live dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "cryptography>=41",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ai = ["anthropic>=1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
kalshitrader = "kalshitrader.cli:main"
# One command that runs dashboard + bot together, which is what a packaged build calls.
kalshitrader-app = "kalshitrader.app:main"

[tool.setuptools.packages.find]
include = ["kalshitrader*"]

[tool.setuptools.package-data]
"kalshitrader.dashboard" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]
